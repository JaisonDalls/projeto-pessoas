services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:10000"
    environment:
      APP_NAME: "Projeto Pessoas"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/docker/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      PORT: 10000
    volumes:
      - app-data:/var/www/html/storage/app/docker

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    profiles:
      - test
    environment:
      APP_ENV: testing
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

volumes:
  app-data:
